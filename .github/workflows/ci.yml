# =============================================================================
# Continuous Integration
#
# Runs on pushes to main and on pull requests targeting main.
# Validates both the Python backend and the Flutter client.
# No API keys or external services are required — tests use SQLite in-memory
# and mock any LLM/HTTP calls.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default to read-only; the badge-commit job below opts up to contents: write.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Backend — lint · type-check · test
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (lint / typecheck / test)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          # Don't leave a write-capable token in .git/config while running
          # untrusted PR test code.
          persist-credentials: false
          # Full history so the diff-coverage step below can resolve
          # origin/<base branch>; the default shallow single-branch clone
          # doesn't fetch it and diff-cover fails with "Could not find the
          # branch to compare to".
          fetch-depth: 0

      # uv manages the virtual-env and Python installation.
      # enable-cache stores the uv download cache between runs.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Install the Python version pinned in .python-version (3.12).
      - name: Set up Python 3.12
        run: uv python install 3.12

      # The dev dependency group (ruff/pytest/pytest-cov/httpx/...) is installed
      # by default; --extra tray pulls in customtkinter/pystray/Pillow so ty can
      # resolve the GUI imports.
      - name: Install dependencies
        run: uv sync --extra tray

      # ── Code quality ────────────────────────────────────────────────────

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/ scripts/

      - name: Format check (ruff)
        run: uv run ruff format --check src/ tests/ scripts/

      # ty is Astral's type-checker.  It is NOT in the project's deps
      # (it lives in the pre-commit hook), so we run it via uvx which
      # installs it in an isolated, ephemeral environment.
      - name: Type check (ty)
        run: uvx ty check src/

      - name: Import layering (import-linter)
        run: uvx --from import-linter lint-imports --config .importlinter

      # ── Tests ───────────────────────────────────────────────────────────

      # RCFLOW_API_KEY is auto-generated at server startup; not needed here.
      # Coverage floor lives in pyproject.toml [tool.coverage.report] fail_under;
      # pytest --cov inherits it and fails the build if the floor is breached.
      - name: Run tests with coverage
        run: uv run pytest tests/ -v --tb=short --cov --cov-report=term-missing --cov-report=xml

      # Diff-scoped coverage: new/changed lines in a PR must be ≥80% covered.
      # This grades only what the PR touched, so it can't be subsidised by the
      # repo-wide average — the highest-leverage gate for AI-authored diffs.
      - name: Diff coverage (pull requests)
        if: github.event_name == 'pull_request'
        run: uvx diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80

      - name: Generate coverage badge
        run: |
          TOTAL=$(uv run coverage report --format=total)
          uv run anybadge --label=coverage --value="${TOTAL}%" --file=docs/assets/coverage.svg --overwrite \
            --color=$([ "$TOTAL" -ge 90 ] && echo brightgreen || [ "$TOTAL" -ge 75 ] && echo green || [ "$TOTAL" -ge 60 ] && echo yellow || echo red)

      - name: Upload coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: docs/assets/coverage.svg

  # ---------------------------------------------------------------------------
  # Security scanning — dependency CVEs + secret detection
  # ---------------------------------------------------------------------------
  security:
    name: Security (pip-audit / gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Audit resolved dependencies (pip-audit)
        run: |
          uv export --format requirements-txt --no-emit-project --no-hashes > /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Coverage badge commit — isolated write-scoped job (push-to-main only), so
  # the untrusted PR test runs above never hold a write-capable token.
  # ---------------------------------------------------------------------------
  badge:
    name: Commit coverage badge
    needs: backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: coverage-badge
          path: docs/assets
      - name: Commit coverage badge
        run: |
          git config user.name "Flowelfox"
          git config user.email "Flowelfox@users.noreply.github.com"
          git add docs/assets/coverage.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          fi

  # ---------------------------------------------------------------------------
  # Flutter client — analyze · test
  # ---------------------------------------------------------------------------
  flutter:
    name: Flutter client (analyze / test)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Set up the stable Flutter channel.  The pub-cache directory is
      # cached between runs to speed up subsequent pub-get invocations.
      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter packages
        working-directory: rcflowclient
        run: flutter pub get

      # Runs the Dart analyzer plus flutter_lints rules.
      # --fatal-warnings promotes warnings to errors to keep the build clean.
      - name: Analyze
        working-directory: rcflowclient
        run: flutter analyze --fatal-warnings

      # Unit + widget tests — no device or emulator required.
      # --coverage emits coverage/lcov.info so the ratchet check below
      # fails the build if line coverage drops below coverage_threshold.txt.
      - name: Test
        working-directory: rcflowclient
        run: flutter test --reporter=expanded --coverage

      - name: Check Flutter coverage floor
        working-directory: rcflowclient
        run: bash tool/check_coverage.sh
